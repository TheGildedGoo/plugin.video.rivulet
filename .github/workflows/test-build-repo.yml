name: Add upstream PR test build to Kodi repo

# Lives only on the test-builds branch. Adds stock plugin.video.rivulet
# (upstream PR 1 test build, pinned commit) to the gh-pages Kodi repository
# as an extra addon entry. The RevRivulet entries, zips and repository addon
# are left byte-identical (addons.xml is appended to, not re-serialised).
# Note: the main-branch "Publish RevRivulet repository" job rebuilds gh-pages
# from scratch, so a later main push removes this entry; re-run this
# workflow (workflow_dispatch) to put it back.
on:
  push:
    branches: [ test-builds ]
    paths:
      - .github/workflows/test-build-repo.yml
      - test-builds/add_to_repo.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-repository
  cancel-in-progress: false

env:
  PR_SHA: 59fb58c31b079c09d32261394722ae0b94cd90c3

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test-builds (script)
        uses: actions/checkout@v4
        with:
          path: tb

      - name: Checkout pinned PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_SHA }}
          path: src
          persist-credentials: false

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: ghp

      - name: Build addon package (same as upstream build.yml)
        working-directory: src
        run: |
          git archive --format=zip --prefix=plugin.video.rivulet/ \
            -o ../rivulet.zip HEAD -- addon.xml default.py service.py resources lib LICENSE

      - name: Add to repository tree
        # The published version is <addon.xml version>.<run number>, new on
        # every run, so Kodi always fetches the fresh zip and offers it as
        # an update. Only the repo copy is bumped, not the PR branch.
        run: python3 tb/test-builds/add_to_repo.py ghp rivulet.zip "${{ github.run_number }}"

      - name: Commit and push gh-pages
        working-directory: ghp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to change"; exit 0; fi
          VER=$(sed -n 's/.*<addon id="plugin.video.rivulet"[^>]* version="\([^"]*\)".*/\1/p' plugin.video.rivulet/addon.xml | head -1)
          git commit -m "test build: add plugin.video.rivulet ${VER} (upstream PR test build, ${PR_SHA:0:7})"
          git push origin HEAD:gh-pages
