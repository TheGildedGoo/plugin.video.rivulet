name: Publish RevRivulet repository

# Every push to main publishes this fork so Kodi's update check sees it.
# The previous workflow published the newest vX.Y.Z tag of official
# plugin.video.rivulet onto gh-pages. Left in place, a merge would replace
# RevRivulet's repository with that upstream tree.
#
# scripts/publish_repo.py bumps addon.xml when the version already on
# gh-pages is not strictly older under Kodi's comparator (0.30.1.rev9 is
# older than 0.30.1.rev10; a string sort gets that backwards). The bump
# commit says [skip ci] so it does not start a second run. The zip built
# in this same job is the bumped tree, so Kodi still updates if branch
# protection refuses the commit push.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# One publisher at a time. Two deploys racing on gh-pages lose the ref lock
# (see the history comment that used to live here). Never cancel: the run
# that gets cancelled could be the one that carries the version bump.
concurrency:
  group: publish-repository
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch the published repository
        run: git fetch origin gh-pages --depth=1 || true

      - name: Bump the version when Kodi would not see an update
        run: python3 scripts/publish_repo.py bump --published-ref origin/gh-pages

      - name: Commit the bump
        run: |
          if git diff --quiet -- addon.xml rev2.version; then
            echo "addon.xml is already newer than the published repository"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add addon.xml rev2.version
            git commit -m "chore(release): bump RevRivulet so Kodi sees an update [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}" || echo "could not push the bump; the zip published below still carries it"
          fi

      - name: Build repository tree
        run: python3 scripts/publish_repo.py build --output _repo

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_repo
          publish_branch: gh-pages
